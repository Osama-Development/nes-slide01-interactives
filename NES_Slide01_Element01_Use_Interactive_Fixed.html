const sequence=content.flatMap((s,i)=>Array.from({length:s.beats},(_,j)=>({scene:i,beat:j})));
let index=0;let changeTimer=0;let lastPointer=0;
const nextEl=document.getElementById('next'),prevEl=document.getElementById('previous');
const pills=document.getElementById('scenePills');pills.innerHTML=content.map((s,i)=>`<button type="button" title="${s.name}" aria-label="اذهب إلى ${s.name}" data-jump="${i}"></button>`).join('');
const sceneButtons=[...pills.children];
function go(to){
 index=Math.max(0,Math.min(sequence.length-1,to)); const {scene,beat}=sequence[index];
 nodes.forEach((node,i)=>{const shown=i===scene;node.classList.toggle('active',shown);node.setAttribute('aria-hidden',String(!shown));for(const el of node.querySelectorAll('.reveal')){const isVisible=shown && Number(el.dataset.at)<=beat;el.classList.toggle('visible',isVisible);}});
 sceneButtons.forEach((b,i)=>{b.classList.toggle('active',i===scene);b.classList.toggle('done',i<scene);b.setAttribute('aria-current',String(i===scene));});
 document.getElementById('sceneNumber').textContent=`${String(scene+1).padStart(2,'0')} / ${String(content.length).padStart(2,'0')}`;
 document.getElementById('sceneName').textContent=content[scene].name;
 document.getElementById('beatNumber').textContent=`${String(index+1).padStart(2,'0')} / ${String(sequence.length).padStart(2,'0')}`;
 prevEl.disabled=index===0;nextEl.innerHTML=index===sequence.length-1?`إعادة العرض ${I('refresh')}`:`التالي ${I('left')}`;
 document.getElementById('announce').textContent=`المشهد ${scene+1}: ${content[scene].name}. ${content[scene].notes[beat]||''}`;
}
function next(){go(index===sequence.length-1?0:index+1)}function previous(){go(index-1)}
nextEl.addEventListener('click',next);prevEl.addEventListener('click',previous);document.getElementById('restart').addEventListener('click',()=>go(0));
pills.addEventListener('click',e=>{const t=e.target.closest('[data-jump]');if(t){const ix=Number(t.dataset.jump);go(sequence.findIndex(p=>p.scene===ix));}});
function fit(){const scale=Math.min(innerWidth/1600,innerHeight/900);document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${scale})`;}
fit();addEventListener('resize',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);
function toast(m){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2700)}
async function fullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen()}else{await document.documentElement.requestFullscreen()}}catch{toast('يمكن استخدام F11 لملء الشاشة.')}}
document.getElementById('full').addEventListener('click',fullscreen);
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||['INPUT','TEXTAREA'].includes(e.target.tagName))return;
 if(['ArrowLeft','ArrowDown',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next()}
 else if(['ArrowRight','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();previous()}
 else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen()}
 else if(e.key.toLowerCase()==='r'){e.preventDefault();go(0)}
 else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(sequence.length-1)} });
let touchStart=null;document.getElementById('viewport').addEventListener('touchstart',e=>{if(e.target.closest('button'))return;const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY}},{passive:true});
document.getElementById('viewport').addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;touchStart=null;if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy)*1.3)return;if(dx<0){previous()}else{next()}},{passive:true});
window.NES_Element01=Object.freeze({get scene(){return sequence[index].scene+1},get step(){return index+1},get totalSteps(){return sequence.length},get totalScenes(){return content.length}});
go(0);
})();
